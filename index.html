<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirect</title>
  <script>
    function redirect() {
      const p = new URLSearchParams(window.location.search);

      const docID     = p.get('DocID');
      const classid   = p.get('classid');
      const objectid  = p.get('objectid');
      const lifecycle = p.get('LifeCycleID');
      const queue     = p.get('QueueID');

      let target = null;

      if (docID) {
        target = `onbase://document/view/?DocID=${encodeURIComponent(docID)}`;
      } else if (classid && objectid) {
        target = `onbase://wv/object/?classid=${encodeURIComponent(classid)}&objectid=${encodeURIComponent(objectid)}`;
      } else if (lifecycle && queue) {
        target = `onbase://wf/lc/?LifeCycleID=${encodeURIComponent(lifecycle)}&QueueID=${encodeURIComponent(queue)}`;
      }

      if (target) {
        // Auto-redirect
        window.location.href = target;

        // Fallback button in case browser blocks auto
        document.body.innerHTML = `
          <p>Redirecting to OnBase…</p>
          <p><a href="${target}">Click here if it doesn’t open automatically.</a></p>
        `;
      } else {
        document.body.textContent = 'Required parameters are missing.';
      }
    }
  </script>
</head>
<body onload="redirect()"></body>
</html>
